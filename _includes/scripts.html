<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Tabs with sliding indicator ---------- */
  var bar = document.querySelector('.tabs-x');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab-x'));
  var panels = tabs.map(function (t) { return document.getElementById(t.getAttribute('aria-controls')); });
  var ind = null;
  var current = 0;
  function moveInd() {
    if (!ind || !tabs[current]) return;
    var t = tabs[current];
    ind.style.width = t.offsetWidth + 'px';
    ind.style.transform = 'translate(' + t.offsetLeft + 'px,' + (t.offsetTop - 6) + 'px)';
    ind.style.height = t.offsetHeight + 'px';
    ind.style.bottom = 'auto';
  }
  function show(i, focus) {
    current = i;
    tabs.forEach(function (t, j) {
      var on = i === j;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if (panels[j]) panels[j].hidden = !on;
    });
    moveInd();
    if (focus) tabs[i].focus();
  }
  if (bar && tabs.length && panels.every(Boolean)) {
    document.documentElement.classList.add('tabs-on');
    ind = document.createElement('span');
    ind.className = 'tab-ind';
    ind.setAttribute('aria-hidden', 'true');
    bar.insertBefore(ind, bar.firstChild);
    tabs.forEach(function (t, i) {
      t.addEventListener('click', function () {
        show(i);
        history.replaceState(null, '', '#' + t.getAttribute('aria-controls'));
      });
      t.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') show((i + 1) % tabs.length, true);
        if (e.key === 'ArrowLeft') show((i - 1 + tabs.length) % tabs.length, true);
      });
    });
    var start = 0, h = location.hash.slice(1);
    tabs.forEach(function (t, i) { if (t.getAttribute('aria-controls') === h) start = i; });
    var prev = ind.style.transition;
    ind.style.transition = 'none';
    show(start);
    ind.offsetWidth;
    ind.style.transition = prev;
    window.addEventListener('resize', moveInd);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
  }

  /* ---------- Copy email ---------- */
  var btn = document.querySelector('.copy-email');
  if (btn) {
    btn.addEventListener('click', function () {
      var email = btn.getAttribute('data-email');
      var label = btn.querySelector('.copy-label');
      var done = function () {
        btn.classList.add('copied');
        label.textContent = 'Email copied';
        setTimeout(function () { btn.classList.remove('copied'); label.textContent = 'Email'; }, 1800);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(email).then(done, function () { window.location.href = 'mailto:' + email; });
      } else {
        window.location.href = 'mailto:' + email;
      }
    });
  }

})();
</script>
<script>
(function () {
  // "Latest paper" link: switch to the Publications tab and open that paper
  document.querySelectorAll('.jump').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var tab = document.getElementById('t-publications');
      var pub = document.getElementById(a.getAttribute('data-open'));
      if (!tab || !pub) return;
      e.preventDefault();
      tab.click();
      pub.open = true;
      pub.classList.remove('flash'); void pub.offsetWidth; pub.classList.add('flash');
      var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.querySelector('.tabs-x').scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    });
  });
})();
</script>
