<script>
(function () {
  // Publication filters
  var chips = document.querySelectorAll('.chip');
  var pubs = document.querySelectorAll('.pub');
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var f = chip.getAttribute('data-filter');
      chips.forEach(function (c) {
        c.classList.toggle('active', c === chip);
        c.setAttribute('aria-pressed', c === chip ? 'true' : 'false');
      });
      pubs.forEach(function (p) {
        var tags = (p.getAttribute('data-tags') || '').split(' ');
        p.classList.toggle('hidden', f !== 'all' && tags.indexOf(f) === -1);
      });
    });
  });

  // Copy email
  var btn = document.querySelector('.copy-email');
  if (btn) {
    btn.addEventListener('click', function () {
      var email = btn.getAttribute('data-email');
      var hint = btn.querySelector('.copy-hint');
      var done = function () {
        btn.classList.add('copied');
        hint.textContent = 'copied';
        setTimeout(function () { btn.classList.remove('copied'); hint.textContent = 'copy'; }, 1600);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(email).then(done, function () { window.location.href = 'mailto:' + email; });
      } else {
        window.location.href = 'mailto:' + email;
      }
    });
  }
})();
</script>
