<script>
/* A [2,1,1] Kolmogorov-Arnold Network trained in the browser.
   Each edge: phi(z) = w_b * silu(z) + sum_i c_i B_i(z), cubic B-splines on a uniform grid
   (the same edge parameterization used by pykan). Trained by full-batch MSE with Adam or
   L-BFGS (two-loop recursion + backtracking line search). The hidden edge's grid is updated
   from the data during training, then each edge is matched to a symbolic form. */
(function () {
  var net = document.getElementById('kan-net');
  if (!net) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  /* ---------- data ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var NPTS = 200, X = [], Y = [], T = [];
  (function () {
    var r = rng(7);
    for (var n = 0; n < NPTS; n++) {
      var x = 2 * r() - 1, y = 2 * r() - 1;
      X.push(x); Y.push(y); T.push(Math.exp(Math.sin(Math.PI * x) + y * y));
    }
  })();

  /* ---------- splines ---------- */
  var G = 6, K = 3, NB = G + K, P = NB + 1, NP = 3 * P;
  function makeGrid(lo, hi) {
    var h = (hi - lo) / G, t = [];
    for (var j = 0; j <= G + 2 * K; j++) t.push(lo + (j - K) * h);
    return { lo: lo, hi: hi, t: t };
  }
  var tmp = new Float64Array(G + 2 * K);
  function basis(z, grid, out) {
    var t = grid.t, n = t.length - 1, i, k;
    for (i = 0; i < n; i++) tmp[i] = (z >= t[i] && z < t[i + 1]) ? 1 : 0;
    for (k = 1; k <= K; k++) {
      for (i = 0; i < n - k; i++) {
        tmp[i] = (z - t[i]) / (t[i + k] - t[i]) * tmp[i] + (t[i + k + 1] - z) / (t[i + k + 1] - t[i + 1]) * tmp[i + 1];
      }
    }
    for (i = 0; i < NB; i++) out[i] = tmp[i];
  }
  function silu(z) { return z / (1 + Math.exp(-z)); }
  function dsilu(z) { var s = 1 / (1 + Math.exp(-z)); return s + z * s * (1 - s); }
  var bufA = new Float64Array(NB);
  function phi(th, grids, e, z) {
    basis(z, grids[e], bufA);
    var o = e * P, s = th[o + NB] * silu(z);
    for (var i = 0; i < NB; i++) s += th[o + i] * bufA[i];
    return s;
  }

  /* ---------- model state ---------- */
  var theta, grids;
  function init() {
    var r = rng(42);
    theta = new Float64Array(NP);
    for (var e = 0; e < 3; e++) {
      for (var i = 0; i < NB; i++) theta[e * P + i] = (r() - 0.5) * 0.2;
      theta[e * P + NB] = 1;
    }
    grids = [makeGrid(-1, 1), makeGrid(-1, 1), makeGrid(-1, 1)];
    updateHiddenGrid();
  }

  var B1 = new Float64Array(NB), B2 = new Float64Array(NB), B3 = new Float64Array(NB);
  function hidden(th, n) {
    return phi(th, grids, 0, X[n]) + phi(th, grids, 1, Y[n]);
  }
  function lossGrad(th, g) {
    var loss = 0, i, n, o3 = 2 * P;
    if (g) for (i = 0; i < NP; i++) g[i] = 0;
    for (n = 0; n < NPTS; n++) {
      var x = X[n], y = Y[n];
      basis(x, grids[0], B1); basis(y, grids[1], B2);
      var h1 = th[NB] * silu(x), h2 = th[P + NB] * silu(y);
      for (i = 0; i < NB; i++) { h1 += th[i] * B1[i]; h2 += th[P + i] * B2[i]; }
      var h = h1 + h2;
      basis(h, grids[2], B3);
      var out = th[o3 + NB] * silu(h);
      for (i = 0; i < NB; i++) out += th[o3 + i] * B3[i];
      var r = out - T[n];
      loss += r * r;
      if (!g) continue;
      var d = 2 * r / NPTS;
      for (i = 0; i < NB; i++) g[o3 + i] += d * B3[i];
      g[o3 + NB] += d * silu(h);
      var eps = 1e-4;
      var dphi = (phi(th, grids, 2, h + eps) - phi(th, grids, 2, h - eps)) / (2 * eps);
      var dh = d * dphi;
      for (i = 0; i < NB; i++) { g[i] += dh * B1[i]; g[P + i] += dh * B2[i]; }
      g[NB] += dh * silu(x);
      g[P + NB] += dh * silu(y);
    }
    return loss / NPTS;
  }

  /* Refit the hidden edge's spline on a grid spanning the current hidden values (as in pykan's update_grid). */
  function updateHiddenGrid() {
    var hs = [], lo = Infinity, hi = -Infinity, n, i, j;
    for (n = 0; n < NPTS; n++) { var h = hidden(theta, n); hs.push(h); if (h < lo) lo = h; if (h > hi) hi = h; }
    var span = Math.max(hi - lo, 1e-3);
    var ng = makeGrid(lo - 0.05 * span, hi + 0.05 * span);
    var o = 2 * P, wb = theta[o + NB];
    var A = [], b = [];
    for (n = 0; n < NPTS; n++) {
      var target = phi(theta, grids, 2, hs[n]) - wb * silu(hs[n]);
      var row = new Float64Array(NB); basis(hs[n], ng, row);
      A.push(row); b.push(target);
    }
    var M = [], v = [];
    for (i = 0; i < NB; i++) {
      M.push(new Float64Array(NB)); v.push(0);
      for (n = 0; n < NPTS; n++) v[i] += A[n][i] * b[n];
      for (j = 0; j < NB; j++) { var s = 0; for (n = 0; n < NPTS; n++) s += A[n][i] * A[n][j]; M[i][j] = s + (i === j ? 1e-6 : 0); }
    }
    var c = solve(M, v);
    for (i = 0; i < NB; i++) theta[o + i] = c[i];
    grids[2] = ng;
  }
  function solve(M, v) {
    var n = v.length, i, j, k, a = M.map(function (r, i) { return Array.prototype.slice.call(r).concat([v[i]]); });
    for (i = 0; i < n; i++) {
      var p = i; for (k = i + 1; k < n; k++) if (Math.abs(a[k][i]) > Math.abs(a[p][i])) p = k;
      var t = a[i]; a[i] = a[p]; a[p] = t;
      for (k = i + 1; k < n; k++) { var f = a[k][i] / a[i][i]; for (j = i; j <= n; j++) a[k][j] -= f * a[i][j]; }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) { var s = a[i][n]; for (j = i + 1; j < n; j++) s -= a[i][j] * x[j]; x[i] = s / a[i][i]; }
    return x;
  }

  /* ---------- optimizers ---------- */
  function Adam(lr) {
    var m = new Float64Array(NP), v = new Float64Array(NP), t = 0, g = new Float64Array(NP);
    return function () {
      var L = lossGrad(theta, g); t++;
      for (var i = 0; i < NP; i++) {
        m[i] = 0.9 * m[i] + 0.1 * g[i];
        v[i] = 0.999 * v[i] + 0.001 * g[i] * g[i];
        var mh = m[i] / (1 - Math.pow(0.9, t)), vh = v[i] / (1 - Math.pow(0.999, t));
        theta[i] -= lr * mh / (Math.sqrt(vh) + 1e-8);
      }
      return L;
    };
  }
  function LBFGS(mem) {
    var S = [], Yv = [], g = new Float64Array(NP), L = null;
    function dot(a, b) { var s = 0; for (var i = 0; i < NP; i++) s += a[i] * b[i]; return s; }
    var api = function () {
      if (L === null) L = lossGrad(theta, g);
      var q = Float64Array.from(g), al = [], i, k;
      for (k = S.length - 1; k >= 0; k--) { var rho = 1 / dot(Yv[k], S[k]); al[k] = rho * dot(S[k], q); for (i = 0; i < NP; i++) q[i] -= al[k] * Yv[k][i]; }
      var gam = S.length ? dot(S[S.length - 1], Yv[S.length - 1]) / dot(Yv[Yv.length - 1], Yv[Yv.length - 1]) : 1e-2;
      for (i = 0; i < NP; i++) q[i] *= gam;
      for (k = 0; k < S.length; k++) { var rho2 = 1 / dot(Yv[k], S[k]), be = rho2 * dot(Yv[k], q); for (i = 0; i < NP; i++) q[i] += S[k][i] * (al[k] - be); }
      var dir = q.map(function (z) { return -z; });
      var gd = dot(g, dir);
      if (gd >= 0) { S = []; Yv = []; dir = g.map(function (z) { return -1e-2 * z; }); gd = dot(g, dir); }
      var old = Float64Array.from(theta), gNew = new Float64Array(NP), step = 1, Lnew;
      for (var tries = 0; tries < 30; tries++) {
        for (i = 0; i < NP; i++) theta[i] = old[i] + step * dir[i];
        Lnew = lossGrad(theta, gNew);
        if (isFinite(Lnew) && Lnew <= L + 1e-4 * step * gd) break;
        step *= 0.5;
      }
      if (!(isFinite(Lnew) && Lnew <= L)) { theta.set(old); S = []; Yv = []; return L; }
      var s = new Float64Array(NP), y = new Float64Array(NP);
      for (i = 0; i < NP; i++) { s[i] = theta[i] - old[i]; y[i] = gNew[i] - g[i]; }
      if (dot(s, y) > 1e-12) { S.push(s); Yv.push(y); if (S.length > mem) { S.shift(); Yv.shift(); } }
      g = gNew; L = Lnew;
      return L;
    };
    api.reset = function () { S = []; Yv = []; L = null; };
    return api;
  }

  /* ---------- training schedules ---------- */
  var ADAM_STEPS = 1500, LB_STEPS = 80, LB_ADAM = 300;
  function schedule(kind) {
    var plan = [];
    if (kind === 'adam') {
      var adam = Adam(0.03);
      for (var s = 0; s < ADAM_STEPS; s++) plan.push({ fn: adam, name: 'Adam', grid: s > 0 && s % 100 === 0 && s <= 500 });
    } else {
      var lb = LBFGS(10), adam2 = Adam(0.005);
      for (var a = 0; a < LB_STEPS; a++) plan.push({ fn: lb, name: 'L-BFGS', grid: a > 0 && a % 15 === 0 && a <= 45, lb: lb });
      for (var b = 0; b < LB_ADAM; b++) plan.push({ fn: adam2, name: 'Adam', grid: false });
    }
    return plan;
  }

  /* ---------- symbolic matching ---------- */
  function linfit(u, y) {
    var n = u.length, su = 0, sy = 0, suu = 0, suy = 0, i;
    for (i = 0; i < n; i++) { su += u[i]; sy += y[i]; suu += u[i] * u[i]; suy += u[i] * y[i]; }
    var den = n * suu - su * su;
    if (Math.abs(den) < 1e-12) return null;
    var a = (n * suy - su * sy) / den, d = (sy - a * su) / n;
    return { a: a, d: d, err: sse(u, y, a, d) };
  }
  function sse(u, y, a, d) { var s = 0; for (var i = 0; i < u.length; i++) { var r = a * u[i] + d - y[i]; s += r * r; } return s; }
  function sst(y) { var m = y.reduce(function (p, q) { return p + q; }, 0) / y.length; return y.reduce(function (p, q) { return p + (q - m) * (q - m); }, 0); }
  function fitSym(zs, ys) {
    var tot = sst(ys) || 1e-12, res = [];
    var lf = linfit(zs, ys); res.push({ kind: 'x', a: lf.a, d: lf.d, err: lf.err / tot, cx: 0 });
    // quadratic: y = p z^2 + q z + r
    var best = null;
    (function () {
      var n = zs.length, S = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], v = [0, 0, 0];
      for (var i = 0; i < n; i++) { var f = [zs[i] * zs[i], zs[i], 1]; for (var j = 0; j < 3; j++) { v[j] += f[j] * ys[i]; for (var k = 0; k < 3; k++) S[j][k] += f[j] * f[k]; } }
      var c = solve(S, v), e = 0;
      for (var i2 = 0; i2 < n; i2++) { var r = c[0] * zs[i2] * zs[i2] + c[1] * zs[i2] + c[2] - ys[i2]; e += r * r; }
      res.push({ kind: 'x2', p: c[0], q: c[1], r: c[2], err: e / tot, cx: 1 });
    })();
    function scan(kind, bs, cs, f, cx) {
      var bb = null;
      bs.forEach(function (b) { cs.forEach(function (c) {
        var u = zs.map(function (z) { return f(b * z + c); });
        var l = linfit(u, ys); if (l && (!bb || l.err < bb.err)) bb = { kind: kind, a: l.a, b: b, c: c, d: l.d, err: l.err };
      }); });
      return bb;
    }
    function lin(a, b, s) { var o = []; for (var v = a; v <= b + 1e-9; v += s) o.push(v); return o; }
    var e1 = scan('exp', lin(-3, 3, 0.05).filter(function (b) { return Math.abs(b) > 0.04; }), [0], Math.exp);
    e1 = scan('exp', lin(e1.b - 0.05, e1.b + 0.05, 0.002), [0], Math.exp);
    e1.err /= tot; e1.cx = 2; res.push(e1);
    var s1 = scan('sin', lin(0.3, 6, 0.05), lin(-Math.PI, Math.PI, Math.PI / 32), Math.sin);
    s1 = scan('sin', lin(s1.b - 0.05, s1.b + 0.05, 0.002), lin(s1.c - 0.1, s1.c + 0.1, 0.005), Math.sin);
    s1.err /= tot; s1.cx = 3; res.push(s1);
    var bestErr = Math.min.apply(null, res.map(function (r) { return r.err; }));
    var ok = res.filter(function (r) { return r.err <= 3 * bestErr + 1e-5; });
    ok.sort(function (p, q) { return p.cx - q.cx; });
    var pick = ok[0]; pick.r2 = 1 - pick.err;
    return pick;
  }
  function f2(v) { var s = Math.abs(v) < 0.005 ? '0.00' : v.toFixed(2); return s; }
  function symLabel(m, v) {
    if (m.kind === 'x') return 'linear';
    if (m.kind === 'x2') { var sh = m.q / (2 * m.p); return Math.abs(sh) < 0.05 ? v + '²' : '(' + v + (sh > 0 ? ' + ' : ' − ') + Math.abs(sh).toFixed(2) + ')²'; }
    if (m.kind === 'exp') return 'exp';
    if (m.kind === 'sin') {
      var b = m.b, c = ((m.c + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI, neg = '';
      if (b < 0) { b = -b; c = -c; neg = '−'; }
      if (Math.abs(c) > Math.PI - 0.06) { c = 0; neg = neg ? '' : '−'; }
      var bs = Math.abs(b - Math.PI) < 0.06 ? 'π' : b.toFixed(2);
      if (Math.abs(c) < 0.06) return neg + 'sin(' + bs + v + ')';
      return Math.abs(c) < 0.06 ? 'sin(' + bs + v + ')' : 'sin(' + bs + v + (c > 0 ? ' + ' : ' − ') + Math.abs(c).toFixed(2) + ')';
    }
  }
  function edgeSamples(e) {
    var lo, hi;
    if (e < 2) { lo = -1; hi = 1; }
    else { lo = Infinity; hi = -Infinity; for (var n = 0; n < NPTS; n++) { var h = hidden(theta, n); lo = Math.min(lo, h); hi = Math.max(hi, h); } }
    var zs = [], ys = [];
    for (var i = 0; i <= 100; i++) { var z = lo + (hi - lo) * i / 100; zs.push(z); ys.push(phi(theta, grids, e, z)); }
    return { zs: zs, ys: ys, lo: lo, hi: hi };
  }
  var symbolic = null;
  function readBack() {
    var m = [0, 1, 2].map(function (e) { var s = edgeSamples(e); return fitSym(s.zs, s.ys); });
    symbolic = m;
    var fx = document.getElementById('kan-formula');
    if (m[0].kind === 'sin' && m[1].kind === 'x2' && m[2].kind === 'exp') {
      // phi0 = a0 sin(b0 x + c0) + d0 ; phi1 = p y^2 + q y + r ; phi2 = a2 exp(b2 h) + d2
      var A = m[2].b * m[0].a, Pp = m[2].b * m[1].p, Q = m[2].b * m[1].q;
      var Kc = m[2].a * Math.exp(m[2].b * (m[0].d + m[1].r)), D = m[2].d;
      if (A < 0) { A = -A; m[0].b = -m[0].b; m[0].c = -m[0].c; }
      if (m[0].b < 0) { m[0].b = -m[0].b; m[0].c = -m[0].c + Math.PI; }
      var sinTerm = symLabel({ kind: 'sin', b: m[0].b, c: ((m[0].c + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI }, 'x');
      var s = 'Read back: f ≈ ' + f2(Kc) + '·exp(' + f2(A) + '·' + sinTerm + ' + ' + f2(Pp) + '·y²';
      if (Math.abs(Q) >= 0.05) s += (Q > 0 ? ' + ' : ' − ') + Math.abs(Q).toFixed(2) + '·y';
      s += ')';
      if (Math.abs(D) >= 0.05) s += (D > 0 ? ' + ' : ' − ') + Math.abs(D).toFixed(2);
      fx.textContent = s;
      fx.classList.add('found');
    } else {
      fx.textContent = 'Edges matched: ' + symLabel(m[0], 'x') + ', ' + symLabel(m[1], 'y') + ', ' + symLabel(m[2], 'h') + '. Try training again.';
    }
  }

  /* ---------- drawing ---------- */
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || net).appendChild(e);
    return e;
  }
  var nodes = { x: [120, 226], y: [240, 226], h: [180, 124], f: [180, 12] };
  var boxes = [ { cx: 120, cy: 166, from: 'x', to: 'h', v: 'x', side: 'left' },
                { cx: 240, cy: 166, from: 'y', to: 'h', v: 'y', side: 'right' },
                { cx: 180, cy: 64, from: 'h', to: 'f', v: 'h', side: 'right' } ];
  var BW = 84, BH = 44;
  boxes.forEach(function (b) {
    var a = nodes[b.from], c = nodes[b.to];
    el('line', { x1: a[0], y1: a[1], x2: b.cx, y2: b.cy + BH / 2, class: 'edge' });
    el('line', { x1: b.cx, y1: b.cy - BH / 2, x2: c[0], y2: c[1], class: 'edge' });
  });
  boxes.forEach(function (b, i) {
    el('rect', { x: b.cx - BW / 2, y: b.cy - BH / 2, width: BW, height: BH, rx: 6, class: 'ebox' });
    b.path = el('path', { class: 'ecurve' });
    var lx = b.side === 'left' ? b.cx - BW / 2 - 6 : b.cx + BW / 2 + 6;
    b.name = el('text', { x: lx, y: b.cy + 3, 'text-anchor': b.side === 'left' ? 'end' : 'start', class: 'ename' });
    b.name.textContent = 'φ' + (i + 1) + '(' + b.v + ')';
    b.sym = el('text', { x: b.cx, y: b.cy + BH / 2 + 11, 'text-anchor': 'middle', class: 'esym' });
  });
  Object.keys(nodes).forEach(function (k) {
    var p = nodes[k];
    el('circle', { cx: p[0], cy: p[1], r: k === 'h' ? 6 : 9, class: 'node' + (k === 'h' ? ' hid' : '') });
    if (k !== 'h') { var t = el('text', { x: p[0], y: p[1] + 3.5, 'text-anchor': 'middle', class: 'nlbl' }); t.textContent = k; }
  });
  var sumLbl = el('text', { x: nodes.h[0] + 12, y: nodes.h[1] + 4, class: 'ename' }); sumLbl.textContent = 'h = φ1 + φ2';

  function drawNet() {
    boxes.forEach(function (b, e) {
      var s = edgeSamples(e), mn = Math.min.apply(null, s.ys), mx = Math.max.apply(null, s.ys), sp = Math.max(mx - mn, 1e-6);
      var d = s.ys.map(function (y, i) {
        var px = b.cx - BW / 2 + 6 + (BW - 12) * i / 100, py = b.cy + BH / 2 - 6 - (BH - 12) * (y - mn) / sp;
        return (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
      }).join('');
      b.path.setAttribute('d', d);
      b.sym.textContent = symbolic ? '≈ ' + symLabel(symbolic[e], b.v) + ', R² ' + symbolic[e].r2.toFixed(3) : '';
    });
  }

  var lossSvg = document.getElementById('kan-loss-svg');
  var LW = 360, LH = 72, LP = 26, LMIN = -5, LMAX = 1.5;
  function lel(name, attrs) { return el(name, attrs, lossSvg); }
  [1, -1, -3, -5].forEach(function (p) {
    var y = 4 + (LMAX - p) / (LMAX - LMIN) * (LH - 12);
    lel('line', { x1: LP, x2: LW - 4, y1: y, y2: y, class: 'lgrid' });
    var t = lel('text', { x: LP - 4, y: y + 3, 'text-anchor': 'end', class: 'llbl' }); t.textContent = '1e' + p;
  });
  var lossPath = lel('path', { class: 'lcurve' });
  var lossHint = lel('text', { x: (LP + LW) / 2, y: LH / 2 + 2, 'text-anchor': 'middle', class: 'loss-hint' }); lossHint.textContent = 'Press Train to start';
  var lossTag = lel('text', { x: LW - 4, y: LH - 2, 'text-anchor': 'end', class: 'llbl' }); lossTag.textContent = 'training loss (MSE, log scale)';
  var losses = [], totalSteps = ADAM_STEPS;
  function drawLoss() {
    lossHint.style.display = losses.length ? 'none' : '';
    if (!losses.length) { lossPath.setAttribute('d', ''); return; }
    var d = losses.map(function (L, i) {
      var x = LP + (LW - 4 - LP) * i / Math.max(totalSteps - 1, 1);
      var lg = Math.max(LMIN, Math.min(LMAX, Math.log10(L)));
      var y = 4 + (LMAX - lg) / (LMAX - LMIN) * (LH - 12);
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join('');
    lossPath.setAttribute('d', d);
  }

  var stepEl = document.getElementById('kan-step'), lossEl = document.getElementById('kan-loss'), optEl = document.getElementById('kan-opt');
  function stats(name) {
    stepEl.textContent = losses.length;
    lossEl.textContent = losses.length ? losses[losses.length - 1].toExponential(2) : lossGrad(theta).toExponential(2);
    optEl.textContent = name;
  }

  /* ---------- run ---------- */
  var anim = null, btns = Array.prototype.slice.call(document.querySelectorAll('.kan-btns .btn-x'));
  function setBusy(b) { btns.forEach(function (x) { if (x.getAttribute('data-opt') !== 'reset') x.disabled = b; }); }
  function resetAll() {
    if (anim) cancelAnimationFrame(anim); anim = null;
    init(); losses = []; symbolic = null;
    var fx = document.getElementById('kan-formula');
    fx.textContent = 'Target: f(x, y) = exp(sin(πx) + y²)'; fx.classList.remove('found');
    btns.forEach(function (x) { x.classList.remove('on'); });
    setBusy(false); drawNet(); drawLoss(); stats('untrained');
  }
  function run(kind, sync) {
    resetAll();
    var plan = schedule(kind); totalSteps = plan.length;
    var i = 0, per = kind === 'adam' ? 12 : 3;
    function stepOnce() {
      var p = plan[i];
      if (p.grid) { updateHiddenGrid(); if (p.lb) p.lb.reset(); }
      losses.push(p.fn()); i++;
      return p.name;
    }
    if (sync || reduce) {
      var nm; while (i < plan.length) nm = stepOnce();
      readBack(); drawNet(); drawLoss(); stats(nm + ' · done');
      return losses[losses.length - 1];
    }
    setBusy(true);
    (function frame() {
      var nm, n = (plan[i] && plan[i].name === 'L-BFGS') ? 1 : per;
      for (var k = 0; k < n && i < plan.length; k++) nm = stepOnce();
      drawNet(); drawLoss(); stats(nm);
      if (i < plan.length) anim = requestAnimationFrame(frame);
      else { anim = null; readBack(); drawNet(); stats(nm + ' · done'); setBusy(false); }
    })();
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-opt');
      if (k === 'reset') { resetAll(); return; }
      run(k);
      btns.forEach(function (x) { x.classList.toggle('on', x === b); });
    });
  });

  window.kanDemo = { run: function (k) { var L0 = (init(), lossGrad(theta)); var L = run(k, true); return { initial: L0, final: L, labels: symbolic.map(function (m, e) { return symLabel(m, ['x', 'y', 'h'][e]) + ' R2=' + m.r2.toFixed(4); }), formula: document.getElementById('kan-formula').textContent }; } };
  resetAll();
})();
</script>
