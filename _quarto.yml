project:
  type: website

website:
  title: "Damian Gallegos"
  favicon: images/favicon.png
  page-navigation: false
  navbar:
    right:
      - icon: github
        href: https://github.com/dlgallegose
        aria-label: GitHub

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    page-layout: custom
    toc: false
    include-in-header: _includes/head.html
    include-after-body: _includes/scripts.html
